<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4ef;
            /* 紙の色 */
            --ink: #1d1d1b;
            /* 墨の色 */
            --sub: #8a8680;
            /* 補助の文字色 */
            --line: #d9d5cc;
            /* 細い線 */
            --accent: #b4532a;
            /* アクセント(朱色) */
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg);
            color: #2a2a28;
            font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
            font-size: 16px;
            line-height: 2;
            -webkit-font-smoothing: antialiased;
        }

        header {
            max-width: 880px;
            margin: 0 auto;
            padding: 40px 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .logo {
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-size: 30px;
            color: var(--ink);
        }

        .nav {
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--sub);
        }

        main {
            max-width: 680px;
            margin: 0 auto;
            padding: 80px 24px 120px;
        }

        .meta {
            margin: 0 0 20px;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
        }

        h1 {
            margin: 0 0 56px;
            font-family: "Shippori Mincho", serif;
            font-size: 34px;
            line-height: 1.5;
            font-weight: 700;
            letter-spacing: 0.03em;
            color: var(--ink);
        }

        figure {
            margin: 0 -80px 64px;
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
        }

        figcaption {
            margin-top: 12px;
            font-size: 12px;
            letter-spacing: 0.08em;
            color: var(--sub);
        }

        article p {
            margin: 0 0 2em;
        }

        article h2 {
            margin: 80px 0 28px;
            font-family: "Shippori Mincho", serif;
            font-size: 22px;
            line-height: 1.6;
            font-weight: 500;
            color: var(--ink);
        }

        /* 見出しの上に、朱色の短い線 */
        article h2::before {
            content: "";
            display: block;
            width: 28px;
            height: 1px;
            margin-bottom: 20px;
            background-color: var(--accent);
        }

        footer {
            max-width: 680px;
            margin: 0 auto;
            padding: 24px 24px 64px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--sub);
        }

        article {
            background-color: #fffdf9;
            /* 紙より少し明るい色 */
            border: 1px solid var(--line);
            padding: 64px 48px;
            margin-bottom: 64px;
            /* 記事を並べたときの間隔 */
        }

        @media (max-width: 800px) {
            figure {
                margin: 0 0 48px;
            }

            h1 {
                font-size: 26px;
            }

            main {
                padding-top: 56px;
            }
        }

        .editor {
            margin-bottom: 64px;
        }

        .editor input,
        .editor textarea {
            display: block;
            width: 100%;
            margin-bottom: 12px;
            padding: 12px;
            border: 1px solid var(--line);
            background-color: #fffdf9;
            font-family: inherit;
            font-size: 16px;
        }

        .editor textarea {
            height: 120px;
        }

        .editor button {
            padding: 10px 24px;
            border: 1px solid var(--ink);
            background-color: var(--ink);
            color: var(--bg);
            font-size: 14px;
            letter-spacing: 0.1em;
            cursor: pointer;
        }

        article p {
            white-space: pre-wrap;
            /* 本文の改行をそのまま表示する */
        }

        .editButton,
        .deleteButton {
            padding: 6px 16px;
            border: 1px solid var(--sub);
            background-color: transparent;
            color: var(--sub);
            font-size: 12px;
            letter-spacing: 0.1em;
            cursor: pointer;
        }

        .editButton {
            margin-right: 8px;
        }

        .editButton:hover,
        .deleteButton:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        article input,
        article textarea {
            display: block;
            width: 100%;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid var(--line);
            background-color: #fffdf9;
            font-family: inherit;
            font-size: 16px;
        }

        article textarea {
            height: 140px;
        }
    </style>
</head>

<body>
    <h1>ジャーナル</h1>
    <div class="editor">
        <input id="titleInput" type="text" placeholder="タイトル">
        <textarea id="bodyInput" placeholder="本文を書く"></textarea>
        <button id="addButton">記事を追加</button>
    </div>



    <script>

        // 「addButton」という名前のボタンを探して、buttonと呼ぶ
        const button = document.getElementById("addButton");

        // 「.editor」の箱(入力欄まわり)を探して、editorと呼ぶ
        const editor = document.querySelector(".editor");

        // 記事を1つ画面に出す処理
        // ★ id(識別番号)も受け取るようにした(まだ使わない)
        function showArticle(title, body, id) {
            const article = document.createElement("article");

            const h1 = document.createElement("h1");
            h1.textContent = title;

            const p = document.createElement("p");
            p.textContent = body;

            // 編集ボタンを作る
            const editButton = document.createElement("button");
            editButton.textContent = "編集";
            editButton.className = "editButton";

            // 編集ボタンがクリックされたら、{ } の中を実行する
            editButton.addEventListener("click", function () {

                // タイトル用の入力欄を作り、いまのタイトルを入れておく
                const titleInput = document.createElement("input");
                titleInput.type = "text";
                titleInput.value = h1.textContent;

                // 本文用の入力欄を作り、いまの本文を入れておく
                const bodyInput = document.createElement("textarea");
                bodyInput.value = p.textContent;

                // 「保存」ボタンを作る
                const saveButton = document.createElement("button");
                saveButton.textContent = "保存";
                saveButton.className = "editButton";

                // 保存ボタンがクリックされたら、{ } の中を実行する
                saveButton.addEventListener("click", function () {

                    // 入力欄に書かれた、新しいタイトルと本文を取り出す
                    const newTitle = titleInput.value;
                    const newBody = bodyInput.value;

                    // どちらかが空っぽなら、メッセージを出して終わる
                    if (newTitle === "" || newBody === "") {
                        alert("タイトルと本文を入力してください");
                        return;
                    }

                    // 見出しと段落の文字を、新しい内容に書き換える
                    h1.textContent = newTitle;
                    p.textContent = newBody;

                    // ★ 保存済みのリストを、引き出しから出す
                    const list = JSON.parse(localStorage.getItem("articles") || "[]");

                    // ★ リストの1つずつを見て、idが同じ記事だけ新しい内容にした、新しいリストを作る
                    const updatedList = list.map(function (item) {
                        if (item.id === id) {
                            return { id: item.id, title: newTitle, body: newBody };
                        }
                        return item;
                    });

                    // ★ 新しいリストを、引き出しに入れ直す
                    localStorage.setItem("articles", JSON.stringify(updatedList));

                    // 入力欄を見出しと段落に、保存ボタンを編集ボタンに、入れ替えて戻す
                    titleInput.replaceWith(h1);
                    bodyInput.replaceWith(p);
                    saveButton.replaceWith(editButton);
                });

                // 見出しを入力欄に、段落を入力欄に、編集ボタンを保存ボタンに入れ替える
                h1.replaceWith(titleInput);
                p.replaceWith(bodyInput);
                editButton.replaceWith(saveButton);
            });

            // 削除ボタンを作る
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "削除";
            deleteButton.className = "deleteButton";

            // 削除ボタンがクリックされたら、{ } の中を実行する
            deleteButton.addEventListener("click", function () {

                // この記事を、画面から消す
                article.remove();

                // 保存済みのリストを、引き出しから出す
                const list = JSON.parse(localStorage.getItem("articles") || "[]");

                // リストから、この記事(idが同じもの)だけを除いた、新しいリストを作る
                const newList = list.filter(function (item) {
                    return item.id !== id;
                });

                // 新しいリストを、引き出しに入れ直す
                localStorage.setItem("articles", JSON.stringify(newList));
            });

            // 記事の箱に、見出し、本文、2つのボタンを入れる
            article.append(h1, p, editButton, deleteButton);
            editor.after(article);
        }
        // 【ページを開いたとき】
        // 保存済みの記事を、引き出しから出して、savedと呼ぶ
        const saved = JSON.parse(localStorage.getItem("articles") || "[]");

        // ★ 古い記事(idがまだない)に、idをつける
        // index は「何番目か」(0, 1, 2…)。足すことで、重ならない番号にする
        saved.forEach(function (item, index) {
            if (item.id === undefined) {
                item.id = Date.now() + index;
            }
        });

        // ★ idをつけたリストを、保存し直す
        localStorage.setItem("articles", JSON.stringify(saved));

        // 1つずつ、記事を画面に出す
        // ★ idも一緒に渡す
        saved.forEach(function (item) {
            showArticle(item.title, item.body, item.id);
        });

        // 【ボタンがクリックされたとき】
        button.addEventListener("click", function () {

            // 入力欄の文字を取り出す
            const title = document.getElementById("titleInput").value;
            const body = document.getElementById("bodyInput").value;

            // 空ならメッセージを出して終わる
            if (title === "" || body === "") {
                alert("タイトルと本文を入力してください");
                return;
            }

            // ★ 新しい記事のid(いまの時刻をあらわす数字)を作る
            const id = Date.now();

            // ★ idも渡して、画面に出す
            showArticle(title, body, id);

            // 【保存】 出す → 足す → 入れ直す
            const list = JSON.parse(localStorage.getItem("articles") || "[]");

            // ★ セットに id も入れて、リストに足す
            list.push({ id: id, title: title, body: body });

            localStorage.setItem("articles", JSON.stringify(list));

            // 入力欄を空っぽに戻す
            document.getElementById("titleInput").value = "";
            document.getElementById("bodyInput").value = "";
        });
    </script>


</body>

</html>
